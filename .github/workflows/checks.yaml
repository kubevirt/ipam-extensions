name: Checks
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify Manifests
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Cache Go modules and build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Check vendoring
      run: make check-vendoring

    - name: Build
      run: time make

    - name: Sanitize branch name for container image tag
      shell: bash
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BRANCH_NAME="${{ github.base_ref }}"
        fi
        SANITIZED_BRANCH=$(./hack/sanitize-branch.sh "${BRANCH_NAME}")
        echo "image_tag=${SANITIZED_BRANCH}" >> $GITHUB_ENV

    - name: Ensure branch contains manifests with correct image tag
      run: |
        echo "" > dist/install.yaml
        IMG=ghcr.io/kubevirt/ipam-controller:${{ env.image_tag }} make build-installer
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "Please run 'make build-installer' and commit those changes"
          git status --porcelain
          exit 1
        fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Cache Go modules and build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Linters
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.4
        args: --timeout 3m --verbose cmd/... pkg/...

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Cache Go modules and build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Test
      run: ENVTEST_VERSION="release-0.20" make test

  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate PR commits follow conventional format
      run: |
        COMMITS=$(git log --no-merges --format='%s' origin/${{ github.base_ref }}..${{ github.sha }})
        PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
        FAILED=0
        while IFS= read -r msg; do
          if [ -z "$msg" ]; then
            continue
          fi
          if ! echo "$msg" | grep -qE "$PATTERN"; then
            echo "Non-conventional commit: $msg"
            FAILED=1
          fi
        done <<< "$COMMITS"
        if [ "$FAILED" -eq 1 ]; then
          echo ""
          echo "Commits must follow conventional format: type(scope): description"
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          exit 1
        fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Cache Go modules and build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/local/lib/android/sdk
        sudo apt-get update
        sudo eatmydata apt-get purge --auto-remove -y \
          azure-cli aspnetcore-* dotnet-* ghc-* firefox \
          google-chrome-stable \
          llvm-* microsoft-edge-stable mono-* \
          mysql-server-core-* php-* php7* \
          powershell temurin-* zulu-*

    - name: Start cluster
      env:
        KIND_ALLOW_SYSTEM_WRITES: true
      run: make cluster-up

    - name: Sync cluster
      run: make cluster-sync

    - name: Run e2e tests
      run: make test-e2e

    - uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-e2e-results
        path: .output/*.xml

    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-logs
        path: ./test/e2e/_output/*.log
